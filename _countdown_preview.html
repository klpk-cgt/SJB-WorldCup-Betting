<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倒计时卡片预览</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #f1f5f9; }
  @keyframes pulse-ring { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.3) } 50% { box-shadow: 0 0 0 8px rgba(16,185,129,0) } }
  @keyframes breathe { 0%,100% { opacity:0.7 } 50% { opacity:1 } }
  .pulse-ring { animation: pulse-ring 2s ease-in-out infinite; }
  .breathe { animation: breathe 2s ease-in-out infinite; }
</style>
</head>
<body class="max-w-md mx-auto min-h-screen p-4 space-y-5">

<h2 class="text-sm font-black text-slate-500 uppercase tracking-wider mb-4">当前设计</h2>

<!-- 当前设计 -->
<div class="rounded-[28px] border border-emerald-200 bg-gradient-to-r from-emerald-50 via-white to-cyan-50 px-5 py-4 shadow-sm">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-sm">🕐</span>
      <span class="text-xs font-black text-emerald-800">下一场开赛倒计时</span>
    </div>
    <span class="text-[10px] font-semibold text-slate-400">6月15日 03:00</span>
  </div>
  <div class="mt-3 flex items-center gap-3">
    <div class="flex items-center gap-2 text-sm font-black text-slate-900">
      <span class="text-base">🇩🇪</span><span class="truncate">德国</span>
      <span class="text-slate-400">vs</span>
      <span class="truncate">库拉索</span><span class="text-base">🇨🇼</span>
    </div>
    <div class="ml-auto shrink-0 rounded-2xl bg-emerald-600 px-3 py-1.5 font-mono text-lg font-black tracking-wider text-white">08:30</div>
  </div>
</div>

<h2 class="text-sm font-black text-slate-500 uppercase tracking-wider mt-8 mb-4">方案 A — 暗黑质感</h2>
<div class="relative overflow-hidden rounded-[28px] bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 px-5 py-5 shadow-xl">
  <div class="absolute top-0 right-0 w-32 h-32 rounded-full bg-emerald-500/5 blur-3xl"></div>
  <div class="absolute bottom-0 left-0 w-24 h-24 rounded-full bg-amber-500/5 blur-3xl"></div>
  <div class="relative">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-ring"></div>
        <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-emerald-300">即将开赛</span>
      </div>
      <span class="text-[10px] font-semibold text-slate-400">6月15日 · 03:00</span>
    </div>
    <div class="mt-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🇩🇪</span>
        <div class="text-center">
          <p class="text-lg font-black text-white tracking-tight">德国</p>
          <p class="text-[9px] font-bold text-slate-500 mt-0.5">FIFA #2</p>
        </div>
      </div>
      <div class="text-center shrink-0">
        <p class="text-[9px] font-bold uppercase tracking-[0.15em] text-slate-500 mb-1">vs</p>
        <div class="breathe rounded-2xl bg-emerald-500 px-4 py-2 font-mono text-xl font-black text-white shadow-[0_0_24px_rgba(16,185,129,0.3)]">08:30</div>
      </div>
      <div class="flex items-center gap-3 text-right flex-row-reverse">
        <span class="text-3xl">🇨🇼</span>
        <div class="text-center">
          <p class="text-lg font-black text-white tracking-tight">库拉索</p>
          <p class="text-[9px] font-bold text-slate-500 mt-0.5">FIFA #176</p>
        </div>
      </div>
    </div>
  </div>
</div>

<h2 class="text-sm font-black text-slate-500 uppercase tracking-wider mt-8 mb-4">方案 B — 运动员入场</h2>
<div class="relative overflow-hidden rounded-[28px] bg-gradient-to-b from-white to-emerald-50/30 border border-emerald-100/50 px-5 py-5 shadow-md">
  <div class="absolute top-[-20px] right-[-20px] w-24 h-24 rounded-full bg-emerald-100/40 blur-2xl"></div>
  <div class="relative">
    <div class="text-center">
      <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-emerald-600">距离开赛</p>
    </div>
    <div class="mt-3 flex items-center justify-center gap-5">
      <!-- 主队 -->
      <div class="flex flex-col items-center gap-1.5">
        <div class="w-14 h-14 rounded-full bg-gradient-to-b from-slate-50 to-slate-100 border border-slate-200 flex items-center justify-center shadow-sm">
          <span class="text-2xl">🇩🇪</span>
        </div>
        <p class="text-xs font-black text-slate-800">德国</p>
        <p class="text-[9px] font-bold text-slate-400">FIFA #2</p>
      </div>
      <!-- 计时器 -->
      <div class="flex flex-col items-center gap-2 shrink-0">
        <div class="rounded-2xl bg-gradient-to-br from-emerald-500 to-emerald-600 px-5 py-2.5 font-mono text-2xl font-black text-white shadow-lg shadow-emerald-200/50 pulse-ring">
          08<span class="text-emerald-200">:</span>30
        </div>
        <span class="text-[10px] font-bold text-emerald-600 breathe">即将开球 ⚽</span>
      </div>
      <!-- 客队 -->
      <div class="flex flex-col items-center gap-1.5">
        <div class="w-14 h-14 rounded-full bg-gradient-to-b from-slate-50 to-slate-100 border border-slate-200 flex items-center justify-center shadow-sm">
          <span class="text-2xl">🇨🇼</span>
        </div>
        <p class="text-xs font-black text-slate-800">库拉索</p>
        <p class="text-[9px] font-bold text-slate-400">FIFA #176</p>
      </div>
    </div>
    <div class="mt-3 text-center">
      <span class="text-[10px] font-semibold text-slate-400">6月15日 03:00 · 慕尼黑安联球场</span>
    </div>
  </div>
</div>

<h2 class="text-sm font-black text-slate-500 uppercase tracking-wider mt-8 mb-4">方案 C — 极简水平条</h2>
<div class="rounded-[28px] bg-white border border-slate-200 px-5 py-3.5 shadow-sm">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3 min-w-0">
      <span class="text-xl">🇩🇪</span>
      <p class="text-sm font-black text-slate-900 truncate">德国</p>
      <span class="text-[10px] font-bold text-slate-300">VS</span>
      <span class="text-xl">🇨🇼</span>
      <p class="text-sm font-black text-slate-900 truncate">库拉索</p>
    </div>
    <div class="shrink-0 flex items-center gap-2 ml-3">
      <div class="text-right">
        <p class="text-[9px] font-bold text-slate-400">距开赛</p>
        <p class="text-sm font-black text-emerald-600">6月15日 03:00</p>
      </div>
      <div class="rounded-xl bg-emerald-500 px-3 py-1.5 font-mono text-base font-black text-white">08:30</div>
    </div>
  </div>
</div>

</body>
</html>
