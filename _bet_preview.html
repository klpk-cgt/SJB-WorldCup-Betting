<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下注确认 · 方案A增强</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #f1f5f9; }
  @keyframes slideUp { from { opacity:0; transform:translateY(20px) scale(0.96) } to { opacity:1; transform:translateY(0) scale(1) } }
  .confirm-in { animation: slideUp 0.35s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes shimmer { 0% { background-position:-200% 0 } 100% { background-position:200% 0 } }
  .shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); background-size:200% 100%; animation: shimmer 2s infinite; }
</style>
</head>
<body class="max-w-md mx-auto min-h-screen p-4 space-y-6">

<h2 class="text-sm font-black text-slate-400 uppercase tracking-wider">方案 A · 精装版</h2>
<p class="text-[11px] text-slate-500 mb-2">两步确认：填信息 → 确认卡片 → 真正提交</p>

<!-- ===== Step 1: 投注面板 ===== -->
<div class="rounded-[32px] bg-white border border-slate-200 p-5 shadow-[0_10px_40px_rgba(15,23,42,0.05)] relative overflow-hidden">
  <div class="absolute -top-10 -right-10 w-32 h-32 rounded-full bg-amber-100/30 blur-3xl pointer-events-none"></div>

  <!-- 比赛信息 -->
  <div class="relative text-center mb-5">
    <span class="inline-flex items-center gap-1 rounded-full bg-amber-50 border border-amber-100 px-3 py-1 text-[10px] font-black text-amber-700 mb-2">胜平负 · 主胜</span>
    <div class="flex items-center justify-center gap-3 mt-2">
      <div class="flex flex-col items-center gap-1">
        <span class="text-3xl">🇩🇪</span>
        <span class="text-[11px] font-black text-slate-800">德国</span>
      </div>
      <span class="text-[10px] font-bold text-slate-300 px-1">VS</span>
      <div class="flex flex-col items-center gap-1">
        <span class="text-3xl">🇨🇼</span>
        <span class="text-[11px] font-black text-slate-800">库拉索</span>
      </div>
    </div>
  </div>

  <!-- 赔率卡片 -->
  <div class="relative rounded-2xl bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-100/60 px-4 py-3 mb-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-xl bg-amber-100 flex items-center justify-center"><span class="text-xs">📊</span></div>
      <span class="text-[10px] font-bold text-amber-600">当前赔率</span>
    </div>
    <span class="text-xl font-black text-amber-700">@2.45</span>
  </div>

  <!-- 快捷金额 -->
  <div class="grid grid-cols-4 gap-2 mb-3">
    <button class="rounded-xl py-2.5 text-xs font-black bg-slate-50 text-slate-400 border border-slate-100">200</button>
    <button class="rounded-xl py-2.5 text-xs font-black bg-amber-500 text-white shadow-sm shadow-amber-200">500</button>
    <button class="rounded-xl py-2.5 text-xs font-black bg-slate-50 text-slate-400 border border-slate-100">1000</button>
    <button class="rounded-xl py-2.5 text-xs font-black bg-slate-50 text-slate-300 border border-slate-100 cursor-not-allowed">2000</button>
  </div>

  <!-- 自定义金额 -->
  <div class="rounded-2xl bg-slate-50 border border-slate-100 px-4 py-3 flex items-center justify-between mb-1">
    <span class="text-[10px] font-bold text-slate-400">投入积分</span>
    <div class="flex items-center gap-2">
      <svg width="16" height="16" viewBox="0 0 36 36"><defs><linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient></defs><circle cx="18" cy="18" r="16" fill="url(#g1)"/><circle cx="18" cy="18" r="11" fill="#FEF3C7"/><text x="18" y="20.5" text-anchor="middle" font-size="8" font-weight="900" fill="#B45309">P</text></svg>
      <input type="number" value="500" class="w-20 text-right bg-transparent text-lg font-black text-slate-900 outline-none tabular-nums"/>
    </div>
  </div>
  <p class="text-[9px] font-bold text-amber-600/70 mb-4 mt-1 px-1">预计回收 <span class="text-emerald-600">+1,225 PTS</span></p>

  <button class="relative w-full rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 py-3.5 text-sm font-black text-white shadow-lg shadow-amber-200/60 transition active:scale-[0.98] overflow-hidden">
    <span class="relative z-10">确认提交</span>
    <div class="shimmer absolute inset-0 z-0 opacity-30"></div>
  </button>
</div>

<!-- ===== Step 2: 确认卡片（精装） ===== -->
<div class="confirm-in rounded-[32px] bg-white border-2 border-amber-200/60 shadow-[0_20px_60px_rgba(245,158,11,0.12)] relative overflow-hidden">
  <!-- 顶部渐变光带 -->
  <div class="h-1 bg-gradient-to-r from-amber-400 via-orange-400 to-amber-400"></div>

  <div class="p-5 relative">
    <!-- 背景装饰 -->
    <div class="absolute top-0 right-0 w-24 h-24 rounded-full bg-amber-400/5 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-20 h-20 rounded-full bg-orange-300/5 blur-3xl pointer-events-none"></div>

    <!-- 标题 -->
    <div class="relative text-center mb-5">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-amber-100 mb-2">
        <span class="text-xl">⚡</span>
      </div>
      <h3 class="text-sm font-black text-slate-900">确认您的竞猜</h3>
      <p class="mt-0.5 text-[10px] font-bold text-amber-600">提交后不可修改，请仔细核对</p>
    </div>

    <!-- 信息卡片 -->
    <div class="relative rounded-2xl bg-gradient-to-br from-slate-50 via-slate-50 to-amber-50/30 border border-slate-200/60 p-4 space-y-3">
      <!-- 对阵 -->
      <div class="flex items-center justify-center gap-2 bg-white rounded-xl py-2 px-3 shadow-sm">
        <span>🇩🇪</span>
        <span class="text-xs font-black text-slate-800">德国</span>
        <span class="text-[9px] font-bold text-slate-300">VS</span>
        <span class="text-xs font-black text-slate-800">库拉索</span>
        <span>🇨🇼</span>
      </div>

      <!-- 细节行 -->
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="rounded-xl bg-white py-2 shadow-sm">
          <p class="text-[8px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">玩法</p>
          <p class="text-[10px] font-black text-slate-800">主胜</p>
        </div>
        <div class="rounded-xl bg-white py-2 shadow-sm">
          <p class="text-[8px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">赔率</p>
          <p class="text-[10px] font-black text-amber-600">@2.45</p>
        </div>
        <div class="rounded-xl bg-white py-2 shadow-sm">
          <p class="text-[8px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">投入</p>
          <p class="text-[10px] font-black text-slate-800">
            <svg width="12" height="12" viewBox="0 0 36 36" class="inline-block -mt-0.5 mr-0.5"><defs><linearGradient id="g2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient></defs><circle cx="18" cy="18" r="16" fill="url(#g2)"/><circle cx="18" cy="18" r="11" fill="#FEF3C7"/><text x="18" y="20.5" text-anchor="middle" font-size="8" font-weight="900" fill="#B45309">P</text></svg>500
          </p>
        </div>
      </div>

      <!-- 回收 -->
      <div class="flex items-center justify-between rounded-xl bg-emerald-50/60 px-3 py-2.5">
        <span class="text-[10px] font-bold text-emerald-600 flex items-center gap-1">💰 预计回收</span>
        <span class="text-sm font-black text-emerald-700 tabular-nums">+1,225 PTS</span>
      </div>
    </div>

    <!-- 双按钮 -->
    <div class="relative mt-4 flex gap-2.5">
      <button class="flex-1 rounded-2xl bg-slate-100 border border-slate-200 py-3.5 text-xs font-black text-slate-500 transition active:scale-[0.98] hover:bg-slate-200">
        返回修改
      </button>
      <button class="flex-1 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 py-3.5 text-xs font-black text-white shadow-lg shadow-amber-200/60 transition active:scale-[0.98] overflow-hidden relative">
        <span class="relative z-10">⚽ 确认下注</span>
        <div class="shimmer absolute inset-0 z-0 opacity-20"></div>
      </button>
    </div>

    <!-- 安全提示 -->
    <p class="mt-3 text-center text-[9px] font-bold text-slate-300">下注后将消耗 500 PTS，剩余余额 37,680 PTS</p>
  </div>
</div>

</body>
</html>
