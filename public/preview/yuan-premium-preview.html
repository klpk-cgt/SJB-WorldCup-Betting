<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¥ 图标高级感方案</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    background: #0b1120;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2rem;
    max-width: 640px;
    width: 100%;
  }
  .card {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 24px;
    padding: 2.5rem 1.5rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    transition: transform .2s ease;
  }
  .card:hover { transform: translateY(-4px); }
  .icon-stage {
    width: 80px; height: 80px;
    display: flex; align-items: center; justify-content: center;
  }
  .label {
    font-size: .82rem; font-weight: 700; color: rgba(255,255,255,.65);
    text-align: center;
  }
  .label small {
    display: block; font-weight: 400; color: rgba(255,255,255,.3);
    font-size: .65rem; margin-top: 4px;
  }
  .page-title {
    position: fixed; top: 2rem; left: 50%; transform: translateX(-50%);
    font-size: .72rem; font-weight: 600; color: rgba(255,255,255,.2);
    letter-spacing: .1em; text-transform: uppercase;
  }
</style>
</head>
<body>
<span class="page-title">¥ Premium Coin · Design Proposals</span>

<div class="gallery">

  <!-- 方案 A: 奢华金边徽章 -->
  <div class="card">
    <div class="icon-stage">
      <svg width="52" height="52" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="sA">
            <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity=".3"/>
          </filter>
          <linearGradient id="gA1" x1="0" y1="0" x2="50" y2="50">
            <stop offset="0%" stop-color="#fef08a"/><stop offset="30%" stop-color="#f59e0b"/>
            <stop offset="70%" stop-color="#b45309"/><stop offset="100%" stop-color="#78350f"/>
          </linearGradient>
          <linearGradient id="gA2" x1="5" y1="5" x2="45" y2="45">
            <stop offset="0%" stop-color="#fef3c7"/><stop offset="50%" stop-color="#fcd34d"/>
            <stop offset="100%" stop-color="#d97706"/>
          </linearGradient>
          <radialGradient id="gA3" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="rgba(255,255,255,.3)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
        </defs>
        <!-- 外环金边 -->
        <circle cx="25" cy="24" r="20" fill="url(#gA1)" filter="url(#sA)"/>
        <!-- 内圈币面 -->
        <circle cx="25" cy="23" r="15" fill="url(#gA2)"/>
        <!-- 币面微光泽 -->
        <circle cx="25" cy="23" r="15" fill="url(#gA3)"/>
        <!-- ¥ 浮雕字 -->
        <text x="25" y="27" text-anchor="middle" font-size="11" font-weight="900" fill="#78350f" font-family="system-ui, sans-serif" opacity=".85">¥</text>
        <!-- 边缘细线 -->
        <circle cx="25" cy="24" r="20" fill="none" stroke="rgba(255,255,255,.1)" stroke-width=".5"/>
        <!-- 月牙高光 -->
        <path d="M10 15 A16 16 0 0 1 40 15" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="label">A · 奢华金边徽章<small>外环宽边 + 币面微光 + 月牙高光</small></div>
  </div>

  <!-- 方案 B: 浮雕质感金币 -->
  <div class="card">
    <div class="icon-stage">
      <svg width="52" height="52" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="sB">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".3"/>
          </filter>
          <linearGradient id="gB1" x1="5" y1="5" x2="45" y2="45">
            <stop offset="0%" stop-color="#fef3c7"/><stop offset="18%" stop-color="#fcd34d"/>
            <stop offset="50%" stop-color="#d97706"/><stop offset="80%" stop-color="#78350f"/>
            <stop offset="100%" stop-color="#451a03"/>
          </linearGradient>
          <linearGradient id="gB2" x1="10" y1="10" x2="40" y2="40">
            <stop offset="0%" stop-color="#fff7ed"/><stop offset="40%" stop-color="#fef3c7"/>
            <stop offset="100%" stop-color="#f59e0b"/>
          </linearGradient>
          <filter id="innerB">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity=".2"/>
          </filter>
        </defs>
        <!-- 主体金币 -->
        <circle cx="25" cy="24" r="20" fill="url(#gB1)" filter="url(#sB)"/>
        <!-- 币面 -->
        <circle cx="25" cy="23" r="14.5" fill="url(#gB2)"/>
        <!-- 凹陷¥字 -->
        <text x="25" y="27" text-anchor="middle" font-size="10.5" font-weight="900" fill="#92400e" font-family="system-ui, sans-serif" filter="url(#innerB)">¥</text>
        <!-- 币缘内刻线 -->
        <circle cx="25" cy="23" r="14.5" fill="none" stroke="rgba(180,130,50,.25)" stroke-width=".6"/>
        <!-- 顶部高光月牙 -->
        <path d="M11 16 A17 17 0 0 1 39 16" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="19" cy="12" rx="7" ry="2.5" fill="white" opacity=".12"/>
      </svg>
    </div>
    <div class="label">B · 浮雕质感金币<small>内刻线 + 凹陷¥ + 多重高光</small></div>
  </div>

  <!-- 方案 C: 磨砂拉丝金 -->
  <div class="card">
    <div class="icon-stage">
      <svg width="52" height="52" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="sC">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".25"/>
          </filter>
          <radialGradient id="gC1" cx="35%" cy="28%" r="58%">
            <stop offset="0%" stop-color="#fcd34d"/><stop offset="25%" stop-color="#f59e0b"/>
            <stop offset="60%" stop-color="#b45309"/><stop offset="90%" stop-color="#78350f"/>
            <stop offset="100%" stop-color="#451a03"/>
          </radialGradient>
          <radialGradient id="gC2" cx="32%" cy="25%" r="55%">
            <stop offset="0%" stop-color="#fff7ed"/><stop offset="45%" stop-color="#fef3c7"/>
            <stop offset="100%" stop-color="#f59e0b"/>
          </radialGradient>
          <!-- 拉丝纹理 -->
          <pattern id="brush" width="50" height="2" patternUnits="userSpaceOnUse">
            <line x1="0" y1="1" x2="50" y2="1" stroke="rgba(255,255,255,.04)" stroke-width=".4"/>
            <line x1="5" y1="0" x2="45" y2="0" stroke="rgba(0,0,0,.02)" stroke-width=".2"/>
          </pattern>
        </defs>
        <!-- 金币体 -->
        <circle cx="25" cy="24" r="20" fill="url(#gC1)" filter="url(#sC)"/>
        <!-- 币面 -->
        <circle cx="25" cy="23" r="14" fill="url(#gC2)"/>
        <!-- 拉丝纹理 -->
        <circle cx="25" cy="23" r="14" fill="url(#brush)"/>
        <!-- ¥ 字 -->
        <text x="25" y="26.5" text-anchor="middle" font-size="10" font-weight="900" fill="#78350f" font-family="system-ui, sans-serif" opacity=".9">¥</text>
        <!-- 币缘内线 -->
        <circle cx="25" cy="23" r="14" fill="none" stroke="rgba(180,110,30,.3)" stroke-width=".5"/>
        <!-- 点状高光 -->
        <ellipse cx="18" cy="13" rx="6" ry="2.2" fill="white" opacity=".18"/>
      </svg>
    </div>
    <div class="label">C · 磨砂拉丝金<small>拉丝纹理 + 哑光质感 + 内环线</small></div>
  </div>

  <!-- 方案 D: 极简暗金 -->
  <div class="card">
    <div class="icon-stage">
      <svg width="52" height="52" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="sD">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/>
          </filter>
          <linearGradient id="gD1" x1="0" y1="50" x2="50" y2="0">
            <stop offset="0%" stop-color="#78350f"/><stop offset="30%" stop-color="#b45309"/>
            <stop offset="70%" stop-color="#d97706"/><stop offset="100%" stop-color="#fcd34d"/>
          </linearGradient>
          <linearGradient id="gD2" x1="0" y1="45" x2="45" y2="5">
            <stop offset="0%" stop-color="#451a03"/><stop offset="30%" stop-color="#78350f"/>
            <stop offset="70%" stop-color="#b45309"/><stop offset="100%" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <!-- 外环 -->
        <circle cx="25" cy="25" r="19" fill="url(#gD1)" filter="url(#sD)"/>
        <!-- 币面 -->
        <circle cx="25" cy="24" r="13.5" fill="url(#gD2)"/>
        <!-- ¥ 字 -->
        <text x="25" y="27.5" text-anchor="middle" font-size="10" font-weight="900" fill="#fcd34d" font-family="system-ui, sans-serif">¥</text>
        <!-- 极简高光 -->
        <ellipse cx="20" cy="14" rx="7" ry="2.5" fill="white" opacity=".1"/>
        <!-- 底部微光 -->
        <ellipse cx="25" cy="40" rx="9" ry="2" fill="white" opacity=".04"/>
      </svg>
    </div>
    <div class="label">D · 极简暗金<small>深色外环 + 亮色¥ + 克制高光</small></div>
  </div>

</div>
</body>
</html>
